<svg id="svg-api" xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
      <!-- fondo redondeado azul oscuro -->
      <rect width="160" height="160" rx="36" fill="#0C447C"/>
      <!-- panel / pantalla -->
      <rect x="26" y="34" width="108" height="72" rx="8" fill="#185FA5" opacity="0.7"/>
      <rect x="26" y="34" width="108" height="72" rx="8" fill="none" stroke="white" stroke-width="2" opacity="0.25"/>
      <!-- barra superior del panel -->
      <rect x="26" y="34" width="108" height="18" rx="8" fill="white" opacity="0.08"/>
      <!-- tres dots simulando barra de título -->
      <circle cx="42" cy="43" r="3" fill="white" opacity="0.5"/>
      <circle cx="54" cy="43" r="3" fill="white" opacity="0.35"/>
      <circle cx="66" cy="43" r="3" fill="white" opacity="0.2"/>
      <!-- filas de datos simulando inventario -->
      <rect x="38" y="62" width="84" height="6" rx="2" fill="white" opacity="0.55"/>
      <rect x="38" y="74" width="64" height="5" rx="2" fill="white" opacity="0.35"/>
      <rect x="38" y="85" width="72" height="5" rx="2" fill="white" opacity="0.25"/>
      <!-- base / soporte del monitor -->
      <rect x="70" y="106" width="20" height="8" rx="2" fill="white" opacity="0.2"/>
      <rect x="58" y="114" width="44" height="5" rx="2.5" fill="white" opacity="0.18"/>
      <!-- cruz hospitalaria pequeña esquina superior derecha -->
      <rect x="112" y="38" width="5" height="10" rx="1" fill="white" opacity="0.7"/>
      <rect x="109" y="41" width="11" height="4" rx="1" fill="white" opacity="0.7"/>
    </svg>